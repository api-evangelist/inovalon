name: Inovalon
description: >-
  Inovalon is a healthcare technology company providing cloud-based data analytics
  and data-enabled intervention platforms for the healthcare industry. Its Inovalon
  ONE Platform pairs national-scale primary-source datasets with analytics, workflow,
  and SaaS applications used by health plans, providers, pharmacies, life-sciences,
  and specialty organizations for risk adjustment, quality measurement, care-gap
  closure, and revenue-cycle and claims management (including the ABILITY provider
  workflow products). Inovalon was surfaced as a portfolio company of Insight Partners
  and added to the API Evangelist network. Its developer surface is enterprise and
  auth-gated: the corporate site is WAF-protected and the API host api.inovalon.com
  requires authentication (HTTP 401); security and compliance posture is published on
  the public Inovalon Trust Center.
